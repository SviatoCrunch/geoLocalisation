# Audit config — paths are PLACEHOLDERS. Fill real dirs after download; do NOT invent them.
# Run: python3 -m segformer3_full_taxonomy.tools.audit_segmentation_data --config <this file>
out_dir: /home/ubuntu/work/out/segformer3_full_taxonomy/audit

sources:
  # ---- external validation (already on server) — can be audited NOW ----
  - name: external_val_kramatorsk
    mode: per_class_binary
    images:
      root: /home/ubuntu/work/gt_cramatorsc/GT_flat
      glob: "*.jpg"
    masks:
      root: /home/ubuntu/work/gt_cramatorsc/GT_flat_mask   # <lat>_<lon>__<Class>.png
    key: latlon

  # ---- SkyScenes H_35_P_0/ClearNoon (after `tar xf` into extracted/) ----
  # image 008261_clrnoon.png  <->  mask 008261_semsegCarla_clrnoon.png  → pair by (\d+)
  - name: skyscenes_H35_P0_ClearNoon
    mode: single
    images:
      root: /home/ubuntu/work/datasets/SkyScenes/extracted/Images
      glob: "**/*.png"
    masks:
      root: /home/ubuntu/work/datasets/SkyScenes/extracted/Segment
      glob: "**/*.png"
      format: auto          # auto-detect index (grayscale IDs) vs rgb (palette)
      pair_key: '(\d+)'     # shared numeric frame id
    limit: 0

  # ---- FlyAwareV2 / Mid-Air: add analogous blocks once downloaded ----
